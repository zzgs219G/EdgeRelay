# workers_dev 必须放在所有表（[assets] / [[routes]] / ...）之前。
#
# TOML 的规则：顶层键一旦写在某个表头之后，就归那个表所有。历史上这里
# 踩过两次坑——先是被并进 [[routes]] 导致
#   Expected "routes" to be ... { pattern, custom_domain, zone_id | zone_name }
# 后来又被并进 [assets]。两者都是部署阶段才炸，且报错信息指向 routes/assets，
# 很难联想到是 workers_dev 放错了位置。所以固定放在这里。
workers_dev = true

# EdgeRelay — APK 构建网关
#
# 由原 ProxyCoordinator（JAVDB 爬虫调度器）重构而来。现在它是
# jian_box APP 的后端：把原先散在 APP 里的 GitHub Token / 仓库地址 /
# run 轮询逻辑整体搬到 Worker 后面，APP 只持有网关签发的 jobId。
#
# 无 Durable Objects、无 Analytics Engine、无 migration —— 纯
# fetch + KV + Cron。

# Worker 名必须与 Cloudflare 控制台已存在的 Worker 完全一致。
#
# 注意：Workers Builds 检测到配置名与控制台不一致时，会用控制台的名字
# 强制覆盖，并试图给仓库开一个"修复"PR。若日志出现
#   Failed to match Worker name. Your config file is using the Worker
#   name "X", but the CI system expected "Y"
# 说明两边不一致，以控制台为准改这里（或去控制台改名）。
name = "edge-relay"
main = "src/index.ts"
# compatibility_date 不能晚于构建服务器的当前日期，否则报
#   Can't set compatibility date in the future: YYYY-MM-DD [code: 10021]
# 以构建机的时钟为准，宁早勿晚。
compatibility_date = "2026-10-19"
compatibility_flags = ["nodejs_compat"]

# ── 静态资源：Vue 3 前端构建产物 ────────────────────────────────────
# frontend/ 里是 Vue 3 + Vite + Element Plus 源码，npm run build 产出
# frontend/dist，由 Worker 一并托管。/api/* 与前端同源，零跨域。
#
# run_worker_first = true：所有请求先过 Worker，/api/*、/login、
# /health 由 Worker 处理，其余 fall through 到静态资源。
# 若设为 false，命中资源的请求根本不进 Worker，登录后的 / 重定向
# 逻辑就拿不到控制权。
#
# not_found_handling：SPA History 路由兜底——未匹配路径回 index.html，
# 由 vue-router 决定渲染登录页还是控制台。
[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
html_handling = "auto-trailing-slash"

# ── 路由：这里刻意不写 [[routes]] ─────────────────────────────────
#
# 生产域名是自定义域 relay.614118.xyz，它在 Cloudflare 控制台
# （Worker → Settings → Domains & Routes）绑定，独立于本文件。控制台的
# 绑定不依赖 wrangler.toml，删掉这里的 routes 不影响它。
#
# 为什么删（踩过的坑）：
#   原来这里有一段
#       [[routes]]
#       pattern = "edge-relay.wu.engineer"
#       custom_domain = true
#   `custom_domain = true` 要求该域名所在的 zone 属于当前账号，而
#   wu.engineer 不在账号下，于是每次部署都在最后一步炸：
#       Can't infer zone from route, please specify zone for
#       "edge-relay.wu.engineer" [code: 10082]
#   注意 Worker 本体在那之前已上传成功（日志里有 "Uploaded edge-relay"），
#   所以现象极具误导性：部署命令报 Failed，线上代码其实换了。排障时会
#   误以为"没部署上去"而反复重推。
#
# 如果将来确要让 wrangler 管理某个自定义域，需要二者之一：
#   - 把该域名所在的 zone 加进当前 Cloudflare 账号，或
#   - 在 routes 上补 zone_id / zone_name
# 否则不要往这里加 custom_domain。
#
# workers_dev = true（文件顶部）仍然提供 <name>.<subdomain>.workers.dev
# 的临时访问地址，它不需要 zone，可作排障用。

# ── KV：任务表 ───────────────────────────────────────────────────────
# binding = EDGE_RELAY_KV，与 Worker 名同源，Dashboard 绑定列表里一眼
# 能认出归属。namespace title 用同名，wrangler 会建成
# edge-relay-EDGE_RELAY_KV。
#
# key 规范：job:<uuid>（构建任务）、health:probe（健康检查探针）。
# value = BuildJob JSON，TTL 见 JOB_RETENTION_DAYS。
#
# namespace id 可以直接提交进 git：它不是 secret（KV namespace id 只是
# 一个标识符，访问控制靠 account 级的 API token）。不要试图用 ${VAR}
# 环境变量替换——wrangler 不支持该语法，会导致 deploy 直接失败。
#
# 创建 namespace（在 PC 上跑，本机跑不了 wrangler）：
#   npx wrangler kv namespace create EDGE_RELAY_KV
# 把输出的 id（32 位十六进制）填到下面。
#
# 占位符故意用非法格式：wrangler 会在部署阶段就报
#   KV namespace 'SET_ME' is not valid [code: 10042]
# 而不是等部署成功、线上请求时才在 KV 上炸。失败得越早越便宜。
[[kv_namespaces]]
binding = "EDGE_RELAY_KV"
id = "adb7121cfadd49a3b7fd6c0e20d1f720"

# ── Cron：兜底轮询未完结任务 ───────────────────────────────────────
# APP 轮询 /api/status 只读 KV，GitHub 调用集中在这里，配额消耗与 APP
# 轮询频率解耦。
#
# 为什么不是每分钟（改过一次，原因写在下面）：
#   KV 的 list 额度是 1000 次/天，而每轮 cron 必做一次 list。
#   `* * * * *` = 1440 轮/天，光 cron 就超额 44%。
#   现已有两道闸把它压下来：
#     1. reconcile.ts 的「未完结信号灯」——空闲时一次 list 都不做
#     2. 下面这行 */2 —— 即使有任务，轮次也减半
#   两者合计约 20 次 list/天（额度的 2%）。
#
# 代价：补绑 run_id 最多晚 2 分钟。但 build.ts 的 waitForRunId 在触发
# 构建的当次请求里已经同步探测过（固定 3 次），正常情况下 run_id 早在
# 构建那一刻就绑好了，cron 只是在「那 3 次都没等到」时才兜底。
[triggers]
crons = ["*/2 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1.0

[dev]
port = 8787

# ── 非密配置 ─────────────────────────────────────────────────────────
[vars]
# 触发分支（apk-protect-action 的默认分支）。
GITHUB_REF = "main"

# 仓库坐标。放在 [vars] 而非 secret：仓库地址本身不敏感，
# 敏感的是 GITHUB_TOKEN（wrangler secret put 设置）。
GITHUB_OWNER = "zzgs219G"
GITHUB_REPO = "apk-protect-action"

# per-token 令牌桶容量（次/分钟）。APP 轮询 + 后台面板共用。
# 典型负载：5s 轮询 × 10 分钟/任务 ≈ 120 次，远低于此值。
# 设 "0" 关闭（压测用）。
RATE_LIMIT_PER_MIN = "120"

# 任务记录保留天数（KV TTL）。7 天足够覆盖排查与复查。
JOB_RETENTION_DAYS = "7"

# dispatch 后等待 run_id 出现的最大毫秒数。
# GitHub 通常 1-2s 内即可在 runs 列表看到；4s 是留了余量的上限。
# 超时不失败，job 以 queued 返回，由 cron 补绑。
RUN_ID_WAIT_MS = "4000"

# R2 公开域名。**必须配**，不是可选——缺了它下载按钮就是废的。
#
# 为什么必须：流水线把产物直链写进 run 注解，而 GitHub 会把出现在
# Actions secret 里的域名打码成 `***`（例如 ***/apks/xxx.apk）。
# 网关抓注解后要用这个值把 `***` 补回真实域名，才拿得到可直接下载的
# R2 链接。补不回来时代码会退回 GitHub artifact 链接——而那个链接需要
# GitHub 令牌，APP 早就不持有了，于是 jian_box 的 TaskViewModel 会拦住它
# 并提示「该任务只有 GitHub Artifact 链接（需令牌）」。
#
# 为什么可以进 git：公开域名本身不敏感（见 README 的凭证表，
# r2_public_domain 一栏标的是"非敏感、公开可读"），敏感的是
# R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY——那两个仍走 secret。
#
# 曾经这里只在一段注释里写着"可选"，导致它从未被赋值，线上因此挂了很久。
R2_PUBLIC_DOMAIN = "https://r2.614118.xyz"

# Secrets（wrangler secret put 设置，绝不进 git / 前端）：
#   GITHUB_TOKEN      — apk-protect-action 的 Actions:Read+Write 令牌
#   RELAY_TOKEN       — 网关调用方令牌（APP 与后台面板共用）

# ── Previews：分支隔离环境（wrangler 4.135+ 的 `wrangler preview`）─────
#
# 为什么需要这一块：一旦开启 Workers Builds 的「预览分支构建」，非生产
# 分支（如 dev）的 push 会执行 Preview command，默认值 `npx wrangler preview`。
# 而 Previews **不继承生产配置**（官方原文：Previews do not inherit
# production settings），绑定必须在这里单独声明，否则 Preview 起来后
# 所有 KV 操作为 undefined，网关一请求就炸。
#
# 顶层哪些设置会被继承（不用在这里重复）：
#   assets / compatibility_date / compatibility_flags —— 见官方配置表
# 所以 [assets] 与 compat 仍留在顶层，此处不抄一遍。
#
# 已踩过的坑（docs/报错.md 2026-10-22T23:38 那条）：
#   当时 wrangler 锁在 ^3.90.0 → 实际装 3.114.17，而 `wrangler preview`
#   在 3.x 里是个只会 throw DeprecationError 的桩（cli.js:121161）：
#     ✘ [ERROR] Deprecation: The `wrangler preview` command has been deprecated.
#     Failed: error occurred while running deploy command
#   同一个命令名在 4.135.0+ 才是「分支预览」功能。因此 package.json 的
#   wrangler 必须 >= 4.135.0，否则这里配了也没用（命令根本执行不到）。
#
# KV 绑定的两种选择：
#   1. 指向**独立的 preview namespace**（推荐）——预览写入不污染生产
#      任务表，也不会打乱生产 meta:open_count 信号灯；
#   2. 留空不写 —— Preview 起得来，但一碰 KV 就 500。
# 当前选择 1。创建（在 PC 上跑，本机跑不了 wrangler）：
#   npx wrangler kv namespace create EDGE_RELAY_KV_PREVIEW
# 把输出 id 填到下面的 [[previews.kv_namespaces]]。
#
# 为什么下面暂时指向生产 id 而不是留占位符：
#   wrangler 遇到非法 namespace id 会在部署阶段直接失败（code 10042），
#   而预览构建失败比「预览与生产共用 KV」更难排查。先用生产 id 让预览
#   能跑起来，等你建好 preview namespace 再替换——替换前请知悉：
#   预览分支上的构建任务会写进生产的任务表。
[previews]

[previews.vars]
# 预览用独立标记，便于在日志/观测里区分请求来源。
ENVIRONMENT = "preview"
GITHUB_REF = "main"
GITHUB_OWNER = "zzgs219G"
GITHUB_REPO = "apk-protect-action"
RATE_LIMIT_PER_MIN = "120"
JOB_RETENTION_DAYS = "7"
RUN_ID_WAIT_MS = "4000"
R2_PUBLIC_DOMAIN = "https://r2.614118.xyz"

# 预览的 KV：暂指向生产 namespace。建好独立 namespace 后把 id 换掉即可。
[[previews.kv_namespaces]]
binding = "EDGE_RELAY_KV"
id = "adb7121cfadd49a3b7fd6c0e20d1f720"
