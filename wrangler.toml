# workers_dev 必须放在所有表（[assets] / [[routes]] / ...）之前。
#
# TOML 的规则：顶层键一旦写在某个表头之后，就归那个表所有。历史上这里
# 踩过两次坑——先是被并进 [[routes]] 导致
#   Expected "routes" to be ... { pattern, custom_domain, zone_id | zone_name }
# 后来又被并进 [assets]。两者都是部署阶段才炸，且报错信息指向 routes/assets，
# 很难联想到是 workers_dev 放错了位置。所以固定放在这里。
workers_dev = true

# EdgeRelay — APK 构建网关
#
# 由原 ProxyCoordinator（JAVDB 爬虫调度器）重构而来。现在它是
# jian_box APP 的后端：把原先散在 APP 里的 GitHub Token / 仓库地址 /
# run 轮询逻辑整体搬到 Worker 后面，APP 只持有网关签发的 jobId。
#
# 无 Durable Objects、无 Analytics Engine、无 migration —— 纯
# fetch + KV + Cron。

# Worker 名必须与 Cloudflare 控制台已存在的 Worker 完全一致。
#
# 注意：Workers Builds 检测到配置名与控制台不一致时，会用控制台的名字
# 强制覆盖，并试图给仓库开一个"修复"PR。若日志出现
#   Failed to match Worker name. Your config file is using the Worker
#   name "X", but the CI system expected "Y"
# 说明两边不一致，以控制台为准改这里（或去控制台改名）。
name = "edge-relay"
main = "src/index.ts"
# compatibility_date 不能晚于构建服务器的当前日期，否则报
#   Can't set compatibility date in the future: YYYY-MM-DD [code: 10021]
# 以构建机的时钟为准，宁早勿晚。
compatibility_date = "2026-10-19"
compatibility_flags = ["nodejs_compat"]

# ── 静态资源：Vue 3 前端构建产物 ────────────────────────────────────
# frontend/ 里是 Vue 3 + Vite + Element Plus 源码，npm run build 产出
# frontend/dist，由 Worker 一并托管。/api/* 与前端同源，零跨域。
#
# run_worker_first = true：所有请求先过 Worker，/api/*、/login、
# /health 由 Worker 处理，其余 fall through 到静态资源。
# 若设为 false，命中资源的请求根本不进 Worker，登录后的 / 重定向
# 逻辑就拿不到控制权。
#
# not_found_handling：SPA History 路由兜底——未匹配路径回 index.html，
# 由 vue-router 决定渲染登录页还是控制台。
[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
html_handling = "auto-trailing-slash"

# 自定义域名（Wrangler 会代配 DNS + 边缘 TLS）。
# zone 必须位于当前 Cloudflare 账号下。
#
# 域名与上面的 name 无强制关系（域名只是路由到这个 Worker 的规则），
# 但建议保持一致以免排查时混淆。若控制台里该 Worker 已绑了
# edge-relay.wu.engineer，就保持这个值；若未绑定，wrangler 会在部署时
# 自动创建 DNS 记录。
[[routes]]
pattern = "edge-relay.wu.engineer"
custom_domain = true

# ── KV：任务表 ───────────────────────────────────────────────────────
# binding = EDGE_RELAY_KV，与 Worker 名同源，Dashboard 绑定列表里一眼
# 能认出归属。namespace title 用同名，wrangler 会建成
# edge-relay-EDGE_RELAY_KV。
#
# key 规范：job:<uuid>（构建任务）、health:probe（健康检查探针）。
# value = BuildJob JSON，TTL 见 JOB_RETENTION_DAYS。
#
# namespace id 可以直接提交进 git：它不是 secret（KV namespace id 只是
# 一个标识符，访问控制靠 account 级的 API token）。不要试图用 ${VAR}
# 环境变量替换——wrangler 不支持该语法，会导致 deploy 直接失败。
#
# 创建 namespace（在 PC 上跑，本机跑不了 wrangler）：
#   npx wrangler kv namespace create EDGE_RELAY_KV
# 把输出的 id（32 位十六进制）填到下面。
#
# 占位符故意用非法格式：wrangler 会在部署阶段就报
#   KV namespace 'SET_ME' is not valid [code: 10042]
# 而不是等部署成功、线上请求时才在 KV 上炸。失败得越早越便宜。
[[kv_namespaces]]
binding = "EDGE_RELAY_KV"
id = "adb7121cfadd49a3b7fd6c0e20d1f720"

# ── Cron：每分钟兜底轮询未完结任务 ───────────────────────────────────
# 1 分钟是 Cloudflare Cron 支持的最小粒度。APP 轮询 /api/status 只读
# KV，GitHub 调用集中在这里，配额消耗与 APP 轮询频率解耦。
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
head_sampling_rate = 1.0

[dev]
port = 8787

# ── 非密配置 ─────────────────────────────────────────────────────────
[vars]
# 触发分支（apk-protect-action 的默认分支）。
GITHUB_REF = "main"

# 仓库坐标。放在 [vars] 而非 secret：仓库地址本身不敏感，
# 敏感的是 GITHUB_TOKEN（wrangler secret put 设置）。
GITHUB_OWNER = "zzgs219G"
GITHUB_REPO = "apk-protect-action"

# per-token 令牌桶容量（次/分钟）。APP 轮询 + 后台面板共用。
# 典型负载：5s 轮询 × 10 分钟/任务 ≈ 120 次，远低于此值。
# 设 "0" 关闭（压测用）。
RATE_LIMIT_PER_MIN = "120"

# 任务记录保留天数（KV TTL）。7 天足够覆盖排查与复查。
JOB_RETENTION_DAYS = "7"

# dispatch 后等待 run_id 出现的最大毫秒数。
# GitHub 通常 1-2s 内即可在 runs 列表看到；4s 是留了余量的上限。
# 超时不失败，job 以 queued 返回，由 cron 补绑。
RUN_ID_WAIT_MS = "4000"

# Secrets（wrangler secret put 设置，绝不进 git / 前端）：
#   GITHUB_TOKEN      — apk-protect-action 的 Actions:Read+Write 令牌
#   RELAY_TOKEN       — 网关调用方令牌（APP 与后台面板共用）
#   R2_PUBLIC_DOMAIN  — 可选。注解里域名被 GitHub 打码成 *** 时用于补全，
#                        如 https://your-r2-domain.example
